_schema-version: 3.3.0
ID: Democap
version: 1.0.0
description: "A simple CAPPP projectts."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Democap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Democap-auth
      - name: Democap-db

  - name: Democap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Democap-db

  # --- Destination content module (subaccount-level) ---
  - name: Democap-destination-content
    type: com.sap.application.content
    path: .
    build-parameters:
      no-source: true
    requires:
      - name: Democap-destination
        parameters:
          content-target: true
      - name: app-api
      - name: Democap-auth
    parameters:
      content:
        subaccount:
          destinations:
            - Name: Democap-router
              URL: https://~{app-api/app-uri}
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Democap-auth
              HTML5.DynamicDestination: true
              WebIDEEnabled: true
              WebIDEUsage: odata_gen
          existing_destinations_policy: update
  - name: Democap
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: Democap-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: Democap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Democap-auth
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: Democap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  # --- Destination service instance ---
  - name: Democap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

