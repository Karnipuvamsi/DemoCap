_schema-version: 3.3.0
ID: Democap
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Democap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Democap-auth
      - name: Democap-db

  - name: Democap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Democap-db

  # --- Destination content module (subaccount-level) ---
  - name: Democap-destination-content
    type: com.sap.application.content
    path: .
    build-parameters:
      no-source: true
    requires:
      - name: Democap-destination
        parameters:
          content-target: true
      - name: srv-api
      - name: Democap-auth
    parameters:
      content:
        subaccount:
          destinations:
            - Name: Democap-srv
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Democap-auth
              HTML5.DynamicDestination: true
              WebIDEEnabled: true
              WebIDEUsage: odata_gen
          existing_destinations_policy: update

resources:
  - name: Democap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Democap-auth
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: Democap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  # --- Destination service instance ---
  - name: Democap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
